{% extends "base.html" %}

{% block title %}{% if object %}Edit Loaf{% else %}Bake a Loaf{% endif %} - Bread Tracker{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{% if object %}Edit Loaf{% else %}Bake a Loaf{% endif %}</h2>
    <p class="subtitle">Enter the details for your bake</p>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            {{ form.as_p }}
        </div>

        <div class="actions-group">
            <div class="primary-actions">
                <button type="submit" class="btn-submit">Save Loaf</button>
                <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
