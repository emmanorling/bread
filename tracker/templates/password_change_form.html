{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍞 Change Password - Bread Tracker</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}?v=2">
</head>
<body>
    <main class="form-card">
        <h2 style="margin: 0 0 20px 0; color: #92400e;">🔒 Change Password</h2>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    
                    {% if field.help_text %}
                        <small class="help-text">{{ field.help_text|safe }}</small>
                    {% endif %}
                    
                    {% if field.errors %}
                        <div style="color: #dc2626; font-size: 0.85rem; margin-top: 4px;">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="actions-group">
                <button type="submit" class="btn-submit">Update Password</button>
                <a href="{% url 'edit_profile' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
