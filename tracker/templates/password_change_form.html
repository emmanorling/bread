{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍞 Change Password</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
</head>
<body>

    <header>
        <h1>🍞 Change Password</h1>
        <a href="{% url 'edit_profile' %}" class="btn btn-outline">← Back to Profile</a>
    </header>

    <main class="card" style="max-width: 500px; margin: 0 auto; padding: 24px;">
        <form method="post">
            {% csrf_token %}
            
            <div style="display: flex; flex-direction: column; gap: 16px;">
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" style="display: block; font-weight: 600; margin-bottom: 6px;">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <small style="color: #868e96; display: block; margin-top: 4px;">{{ field.help_text }}</small>
                        {% endif %}
                        {% if field.errors %}
                            <div style="color: #e03131; font-size: 0.85rem; margin-top: 4px;">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Update Password</button>
                    <a href="{% url 'edit_profile' %}" class="btn btn-outline">Cancel</a>
                </div>
            </div>
        </form>
    </main>

</body>
</html>
