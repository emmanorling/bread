{% extends "base.html" %}

{% block title %}Delete Comment - Bread Tracker{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: #dc2626;">Delete Comment</h2>
    <p>Are you sure you want to delete this comment?</p>

    <div class="comment-card" style="margin: 16px 0;">
        <p class="comment-body">"{{ comment.text }}"</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="actions-group">
            <button type="submit" class="btn-submit" style="background-color: #dc2626;">Confirm Delete</button>
            <a href="{% url 'loaf_detail' comment.loaf.id %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
