{% extends "base.html" %}

{% block title %}Edit Comment - Bread Tracker{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Edit Comment</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <div class="actions-group">
            <button type="submit" class="btn-submit">Save Changes</button>
            <a href="{% url 'loaf_detail' comment.loaf.id %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
