{% extends "base.html" %}

{% block title %}⚙️ Edit Profile - Bread Tracker{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin: 0 0 20px 0; color: #92400e;">⚙️ Edit Profile</h2>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #dc2626; font-size: 0.85rem; margin-top: 4px;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="actions-group">
            <button type="submit" class="btn-submit">Save Profile</button>
            <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel</a>
        </div>

        <a href="{% url 'change_password' %}" class="btn-secondary-link">
            🔒 Change Password
        </a>
    </form>
</div>
{% endblock %}
